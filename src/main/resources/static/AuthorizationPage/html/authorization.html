<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="../css/authorization.css">
    <script type="module" src="../js/authorization.js" defer></script>
</head>
<body>
<header>
    <div class="logo">ПсихоМетрика</div>
    <div class="user-profile">
        <div class="avatar">U</div>
        <div class="user-info">
            <span class="name">Гость</span>
            <span>Войдите или зарегистрируйтесь</span>
        </div>
    </div>
</header>

<div class="container">
    <main class="auth-wrapper">
        <form class="auth-form" id="login-form" data-view="login">
            <h2>Вход в аккаунт</h2>
            <p class="text-muted">Введите email и пароль для доступа</p>

            <div class="form-group">
                <label for="login-email" class="form-label">Email</label>
                <p class="input-error" id="inputErrorEmailLogin"></p>
                <input
                        type="email"
                        id="login-email"
                        name="email"
                        class="form-input"
                        autocomplete="username"
                        placeholder="name@example.com"
                        
                />
            </div>

            <div class="form-group">
                <label for="login-password" class="form-label">Пароль</label>
                <p class="input-error" id="inputErrorPasswordLogin"></p>
                <div class="input-password-wrapper">
                    <input
                            type="password"
                            id="login-password"
                            name="password"
                            class="form-input input-password"
                            autocomplete="new-password"
                            placeholder="***********"
                            
                    />
                    <button type="button" class="toggle-password-btn" aria-label="Показать/скрыть пароль" aria-controls="reg-password">
                    <img class="toggle-password-icon" src="../icon/peephole.svg" alt="eye">
                    </button>  
                </div>
            </div>          

            <button type="button" class="btn btn-primary" id="btn-login">Войти</button>

            <div class="form-footer">
                <a href="#" class="text-link">Забыли пароль?</a>
            </div>
        </form>

        <form class="auth-form hidden" id="register-form" data-view="register">
            <h2>Регистрация</h2>
            <p class="text-muted">Заполните поля, чтобы создать аккаунт</p>

            <div class="form-group">
                <label for="reg-name" class="form-label">Имя</label>
                <p class="input-error" id="inputErrorName"></p>
                <input
                        type="text"
                        id="reg-name"
                        name="name"
                        class="form-input"
                        placeholder="Иван"
                        
                />
            </div>

            <div class="form-group">
                <label for="reg-lastname" class="form-label">Фамилия</label>
                <p class="input-error" id="inputErrorLastname"></p>
                <input
                        type="text"
                        id="reg-lastname"
                        name="lastname"
                        class="form-input"
                        placeholder="Иванов"
                        
                />
            </div>            

            <div class="form-group">
                <label for="reg-email" class="form-label">Email</label>
                <p class="input-error" id="inputErrorEmailRegistr"></p>
                <input
                        type="email"
                        id="reg-email"
                        name="email"
                        class="form-input"
                        placeholder="name@example.com"
                        
                />
            </div>

            <div class="form-group">
                <label for="reg-password" class="form-label">Пароль</label>
                <p class="input-error" id="inputErrorPasswordRegistr"></p>
                <div class="input-password-wrapper">
                    <input
                            type="password"
                            id="reg-password"
                            name="password"
                            class="form-input input-password"
                            autocomplete="new-password"
                            placeholder="Минимум 8 символов"
                           
                    />
                    <button type="button" class="toggle-password-btn" aria-label="Показать/скрыть пароль" aria-controls="reg-password">
                    <img class="toggle-password-icon" src="../icon/peephole.svg" alt="eye">
                    </button>  
                </div>
                            
               
  
            </div>

            <div class="form-group">
                <label for="login-password-repeat" class="form-label">Подтвердите пароль</label>
                <p class="input-error" id="inputErrorPasswordRepeat"></p>
                <div class="input-password-wrapper">
                    <input
                            type="password"
                            id="reg-password-repeat"
                            name="password"
                            autocomplete="new-password"
                            class="form-input input-password"
                            placeholder="********"
                           
                    />
                    <button type="button" class="toggle-password-btn" aria-label="Показать/скрыть пароль" aria-controls="reg-password">
                    <img class="toggle-password-icon" src="../icon/peephole.svg" alt="eye">
                    </button>  
                </div>
            </div>              

            <button type="button" class="btn btn-accent" id="btn-registration">Зарегистрироваться</button>
        </form>

    
        <div class="auth-switcher">
            <button type="button" class="switch-btn" data-target="login">Уже есть аккаунт? Войти</button>
            <button type="button" class="switch-btn" data-target="register">Нет аккаунта? Регистрация</button>
        </div>
    </main>
</div>


</body>
</html>
